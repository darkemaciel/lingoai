services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingoai}
      POSTGRES_DB: ${POSTGRES_DB:-lingoai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lingoai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lingoai}:${POSTGRES_PASSWORD:-lingoai}@postgres:5432/${POSTGRES_DB:-lingoai}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  # Intentionally not started by default — research.md §5 (no cache/session store justified this iteration)

volumes:
  postgres_data:
